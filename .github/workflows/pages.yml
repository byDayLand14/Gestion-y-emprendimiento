name: Publicar ELITECORE en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar sitio estatico sin PHP ni credenciales
        run: |
          mkdir -p public
          cp index.html icon.svg public/
          cp -R assets css data js public/
          touch public/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar pagina
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
